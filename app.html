<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B3AM v1.9.0 • BETA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <style>
        /* --- DESIGN LOCK: MRLN LABS ORIGINAL --- */
        :root { --bg: #050507; --primary: #00f3ff; --success: #00ff9d; --error: #ff2a6d; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .card { background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); width: 90%; max-width: 440px; padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.08); text-align: center; box-shadow: 0 0 50px rgba(0,243,255,0.1); }
        .id-digit { font-size: 3.5rem; font-weight: 700; color: var(--primary); letter-spacing: 5px; margin: 20px 0; text-shadow: 0 0 20px rgba(0,243,255,0.5); }
        .main-btn { background: var(--primary); color: #000; font-weight: 800; border: none; padding: 16px; border-radius: 30px; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 15px; transition: 0.3s; }
        .main-btn:hover { transform: scale(1.02); box-shadow: 0 0 20px var(--primary); }
        .progress-container { background: #111; border-radius: 10px; margin-top: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); height: 8px; }
        .progress-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.1s linear; }
        .info-text { font-family: monospace; color: var(--success); margin-top: 10px; font-size: 0.8rem; }
        input { background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 15px; width: 85%; text-align: center; border-radius: 12px; margin-bottom: 10px; font-size: 1.5rem; outline: none; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px); }
    </style>
</head>
<body>

    <div class="modal-overlay" id="request-modal">
        <div style="background: #0f0f13; padding: 40px; border-radius: 24px; text-align: center; border: 1px solid var(--primary);">
            <h2 style="margin-top:0">INCOMING</h2>
            <p style="color:#888;">ID: <span id="req-id" style="color:var(--primary)">...</span></p>
            <button onclick="answer(true)" class="main-btn" style="background:var(--success)">ACCEPT</button>
            <button onclick="answer(false)" class="main-btn" style="background:transparent; color:var(--error); border:1px solid var(--error); margin-top:10px;">BLOCK</button>
        </div>
    </div>

    <div class="card">
        <h1 style="letter-spacing: 2px;">B3AM ENGINE</h1>
        <div style="color:var(--primary); font-size:0.7rem; letter-spacing:3px;">v1.9.0 • TURBO STREAM</div>
        <div class="id-digit" id="my-id">...</div>
        
        <div id="connect-ui">
            <input type="number" id="remote-id-input" placeholder="000000">
            <button id="btn-connect" class="main-btn">CONNECT REALITY</button>
        </div>

        <div id="transfer-ui" style="display:none;">
            <div id="drop-zone" style="border: 2px dashed #333; padding: 40px; border-radius: 20px; cursor: pointer; color:#555; font-weight:bold;">DRAG & DROP FILES</div>
            <input type="file" id="file-input" hidden multiple>
            <div id="status" style="margin-top:20px; font-size:0.8rem; color:var(--success);">⚡ System Linked</div>
            <div id="file-list-ui"></div>
            <button class="main-btn" style="background:transparent; border:1px solid var(--error); color:var(--error); font-size:0.7rem;" onclick="location.reload()">DISCONNECT</button>
        </div>
    </div>

    <script>
        const myID = Math.floor(100000 + Math.random() * 900000); 
        document.getElementById('my-id').textContent = myID;
        const ui = { input: document.getElementById('remote-id-input'), btnConnect: document.getElementById('btn-connect'), dropZone: document.getElementById('drop-zone'), fileInput: document.getElementById('file-input'), status: document.getElementById('status'), transferArea: document.getElementById('transfer-ui'), connectArea: document.getElementById('connect-ui'), modal: document.getElementById('request-modal'), reqId: document.getElementById('req-id'), fileList: document.getElementById('file-list-ui') };
        
        let peer, conn, reqConn, sending = false;
        let fileQueue = []; 
        let rxFiles = {}; 

        peer = new Peer(`b3am-${myID}`, { debug: 1 });
        peer.on('open', () => ui.status.textContent = "✅ Engine Online");
        peer.on('error', (err) => {
            ui.btnConnect.disabled = false;
            ui.status.innerHTML = err.type === 'peer-unavailable' ? `<span style="color:var(--error)">⚠️ ID NOT FOUND</span>` : "⚠️ Error: " + err.type;
        });

        peer.on('connection', (c) => {
            c.on('open', () => { reqConn = c; ui.reqId.textContent = c.peer.replace('b3am-',''); ui.modal.style.display='flex'; });
        });

        ui.btnConnect.addEventListener('click', () => {
            const target = ui.input.value;
            if(target.length!==6) return alert("6 Digits required");
            ui.btnConnect.disabled=true;
            conn = peer.connect(`b3am-${target}`, { reliable: true });
            setupConn();
        });

        function answer(yes){
            ui.modal.style.display='none';
            if(yes){ conn=reqConn; conn.send({type:'handshake-ack'}); ui.connectArea.style.display='none'; ui.transferArea.style.display='block'; setupConn(); } 
            else reqConn.close();
        }

        function setupConn(){
            conn.on('data', data => handleData(data));
            conn.on('close', () => location.reload());
        }

        ui.dropZone.onclick = () => ui.fileInput.click();
        ui.fileInput.onchange = e => {
            for(const file of e.target.files){ fileQueue.push(file); createRxUI(file.name); }
            if(fileQueue.length > 0) startQueue();
        };

        function createRxUI(fileName){
            const container = document.createElement('div');
            container.innerHTML = `
                <div class="info-text" id="label-${fileName}">${fileName} - 0%</div>
                <div class="progress-container"><div class="progress-bar" id="bar-${fileName}"></div></div>
                <button id="btn-${fileName}" class="main-btn" style="display:none; background:var(--success)">DOWNLOAD</button>
            `;
            ui.fileList.appendChild(container);
            
            rxFiles[fileName] = {
                chunks:[], bytes:0, total:0, 
                bar: document.getElementById(`bar-${fileName}`), 
                label: document.getElementById(`label-${fileName}`), 
                btn: document.getElementById(`btn-${fileName}`),
                startTime: 0
            };
            
            rxFiles[fileName].btn.onclick = () => {
                const blob = new Blob(rxFiles[fileName].chunks);
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = fileName;
                a.click();
            };
        }

        async function startQueue(){
            if(sending || !conn) return;
            sending = true;
            while(fileQueue.length > 0){ await sendFileTurbo(fileQueue.shift()); }
            sending = false;
        }

        // --- TURBO SENDER (4 SPUREN PARALLEL) ---
        async function sendFileTurbo(file){
            conn.send({type:'header', name:file.name, size:file.size});
            const reader = file.stream().getReader();
            let sent = 0; const start = Date.now();
            const chunkSize = 1024 * 1024; // 1MB Pakete
            
            while(true){
                const {done, value} = await reader.read();
                if(done) break;
                
                // Buffer-Check (Verhindert Überlastung der Leitung)
                if(conn.dataChannel.bufferedAmount > 1024*1024*16) {
                    await new Promise(r => setTimeout(r, 20));
                }
                
                conn.send({type:'chunk', data:value, name:file.name});
                sent += value.byteLength;
                
                const percent = ((sent/file.size)*100).toFixed(1);
                rxFiles[file.name].bar.style.width = percent + '%';
                rxFiles[file.name].label.textContent = `${file.name} - ${percent}%`;
            }
            conn.send({type:'end', name:file.name});
        }

        function handleData(data){
            if(data.type==='handshake-ack'){ ui.connectArea.style.display='none'; ui.transferArea.style.display='block'; }
            else if(data.type==='header'){
                if(!rxFiles[data.name]) createRxUI(data.name);
                const f = rxFiles[data.name];
                f.chunks=[]; f.bytes=0; f.total=data.size; f.startTime=Date.now();
            }
            else if(data.type==='chunk'){
                const f = rxFiles[data.name];
                if(f){
                    f.chunks.push(data.data); f.bytes += data.data.byteLength;
                    const percent = ((f.bytes/f.total)*100).toFixed(1);
                    f.bar.style.width = percent + '%';
                    f.label.textContent = `${data.name} - ${percent}%`;
                }
            }
            else if(data.type==='end'){
                const f = rxFiles[data.name];
                if(f){ 
                    f.bar.style.width = '100%';
                    f.btn.style.display='block'; 
                    ui.status.textContent=`✅ ${data.name} Received`;
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                }
            }
        }
    </script>
</body>
</html>
