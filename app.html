<!DOCTYPE html>
<html lang="en">
<head>
    <script src="engine.js" defer></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B3AM MASTER • MRLN LABS</title>
    
    <style>
        /* --- DEIN ORIGINAL DESIGN BLEIBT ZU 100% ERHALTEN --- */
        :root { --bg: #050507; --primary: #00f3ff; --success: #00ff9d; --error: #ff2a6d; --text-muted: #8892b0; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .header-nav { position: fixed; top: 0; left: 0; width: 100%; height: 70px; display: flex; align-items: center; padding: 0 30px; background: rgba(5,5,7,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 1000; }
        .logo-text { color: var(--primary); font-weight: 900; letter-spacing: 3px; font-size: 1.3rem; text-decoration: none; text-shadow: 0 0 15px rgba(0, 243, 255, 0.6); }
        .card { background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); width: 90%; max-width: 440px; padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.08); text-align: center; margin-top: 80px; box-shadow: 0 0 50px rgba(0,243,255,0.1); }
        .id-digit { font-size: 3.5rem; font-weight: 700; color: var(--primary); letter-spacing: 5px; margin: 20px 0; }
        .main-btn { background: var(--primary); color: #000; font-weight: 800; border: none; padding: 16px; border-radius: 30px; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 15px; transition: 0.3s; }
        .main-btn:hover { transform: scale(1.02); box-shadow: 0 0 20px var(--primary); }
        .progress-container { background: #111; border-radius: 10px; margin-top: 10px; overflow: hidden; height: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .progress-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.1s linear; }
        .info-text { font-family: monospace; color: var(--success); margin-top: 15px; font-size: 0.8rem; text-align: left; }
        input { background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 15px; width: 85%; text-align: center; border-radius: 12px; margin-bottom: 10px; font-size: 1.5rem; outline: none; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(10px); }
        .file-box { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-top: 15px; }
    </style>
</head>
<body>

    <header class="header-nav">
        <a href="index.html" class="logo-text">MRLN LABS</a>
    </header>

    <div class="modal-overlay" id="request-modal">
        <div style="background: #0f0f13; padding: 40px; border-radius: 24px; text-align: center; border: 1px solid var(--primary); max-width: 350px;">
            <h2 style="margin-top:0; color:white;">INCOMING B3AM</h2>
            <p style="color:var(--text-muted);">SENDER ID: <span id="req-id" style="color:var(--primary); font-weight:bold;">...</span></p>
            <p style="font-size: 0.8rem; color: #666;">Choose a location to save the incoming file directly.</p>
            <button id="accept-btn" class="main-btn" style="background:var(--success)">ACCEPT & SAVE</button>
            <button onclick="document.getElementById('request-modal').style.display='none'" class="main-btn" style="background:transparent; color:var(--error); border:1px solid var(--error); margin-top:10px;">REJECT</button>
        </div>
    </div>

    <div class="card">
        <h1>B3AM ENGINE</h1>
        <div style="color:var(--primary); font-size:0.7rem; letter-spacing:3px; font-weight:bold;">v5.0.0 • INFINITY CORE</div>
        
        <div class="id-digit" id="my-id">...</div>
        
        <div id="connect-ui">
            <input type="number" id="remote-id-input" placeholder="ENTER TARGET ID">
            <button id="btn-connect" class="main-btn">ESTABLISH LINK</button>
        </div>

        <div id="transfer-ui" style="display:none;">
            <div id="drop-zone" style="border: 2px dashed #333; padding: 40px; border-radius: 20px; cursor: pointer; color:#555; font-weight:bold;">DRAG & DROP TO B3AM</div>
            <input type="file" id="file-input" hidden multiple>
            <div id="status" style="margin-top:20px; font-size:0.8rem; color:var(--primary);">⚡ LINK ESTABLISHED</div>
            <div id="file-list-ui"></div>
            
            <button class="main-btn" style="background:transparent; border:1px solid var(--error); color:var(--error); font-size:0.7rem; margin-top:30px;" onclick="location.reload()">TERMINATE CONNECTION</button>
        </div>
    </div>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
    // 1. ID Generierung (Deine 6 Zahlen)
    const myID = Math.floor(100000 + Math.random() * 900000).toString();
    document.getElementById('my-id').textContent = myID;

    // 2. Engine Start
    const peer = new Peer(myID);
    window.peer = peer; // Damit die engine.js darauf zugreifen kann

    peer.on('open', () => {
        console.log("✅ Dein Code ist aktiv: " + myID);
        document.getElementById('status').textContent = "⚡ ENGINE READY";
    });

    // 3. DER KNOPF-FIX (ESTABLISH LINK)
    document.getElementById('btn-connect').onclick = function() {
        const targetID = document.getElementById('remote-id-input').value;
        
        if (targetID.length !== 6) {
            alert("Bitte genau 6 Zahlen eingeben!");
            return;
        }

        console.log("🚀 Verbinde zu: " + targetID);
        const conn = peer.connect(targetID);

        conn.on('open', () => {
            // UI Umschalten
            document.getElementById('connect-ui').style.display = 'none';
            document.getElementById('transfer-ui').style.display = 'block';
            window.activeConn = conn;
        });
        
        // Falls es nicht klappt, Button wieder freigeben
        setTimeout(() => {
            document.getElementById('status').textContent = "⚡ TRY AGAIN...";
        }, 3000);
    };
</script>
