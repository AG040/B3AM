<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B3AM MASTER • MRLN LABS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <style>
        /* --- DESIGN LOCK: MRLN LABS ORIGINAL --- */
        :root { --bg: #050507; --primary: #00f3ff; --success: #00ff9d; --error: #ff2a6d; --text-muted: #8892b0; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Inter', sans-serif;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .header-nav { position: fixed; top: 0; left: 0; width: 100%; height: 70px; display: flex; align-items: center; padding: 0 30px; background: rgba(5,5,7,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 1000; }
        .logo-text { color: var(--primary); font-weight: 900; letter-spacing: 3px; font-size: 1.3rem; text-decoration: none; text-shadow: 0 0 15px rgba(0, 243, 255, 0.6); }
        .card { background: rgba(255,255,255,0.03); backdrop-filter: blur(15px); width: 90%; max-width: 440px; padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.08); text-align: center; margin-top: 80px; box-shadow: 0 0 50px rgba(0,243,255,0.1); }
        .id-digit { font-size: 3.5rem; font-weight: 700; color: var(--primary); letter-spacing: 5px; margin: 20px 0; }
        .main-btn { background: var(--primary); color: #000; font-weight: 800; border: none; padding: 16px; border-radius: 30px; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 15px; transition: 0.3s; }
        .main-btn:hover { transform: scale(1.02); box-shadow: 0 0 20px var(--primary); }
        .progress-container { background: #111; border-radius: 10px; margin-top: 10px; overflow: hidden; height: 10px; border: 1px solid rgba(255,255,255,0.1); }
        .progress-bar { height: 100%; background: var(--success); width: 0%; transition: width 0.1s linear; }
        .info-text { font-family: monospace; color: var(--success); margin-top: 15px; font-size: 0.8rem; text-align: left; }
        input { background: rgba(255,255,255,0.05); color: white; border: 1px solid rgba(255,255,255,0.1); padding: 15px; width: 85%; text-align: center; border-radius: 12px; margin-bottom: 10px; font-size: 1.5rem; outline: none; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(10px); }
        .file-box { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-top: 15px; }
    </style>
</head>
<body>

    <header class="header-nav">
        <a href="index.html" class="logo-text">MRLN LABS</a>
    </header>

    <div class="modal-overlay" id="request-modal">
        <div style="background: #0f0f13; padding: 40px; border-radius: 24px; text-align: center; border: 1px solid var(--primary); max-width: 350px;">
            <h2 style="margin-top:0; color:white;">INCOMING B3AM</h2>
            <p style="color:var(--text-muted);">SENDER ID: <span id="req-id" style="color:var(--primary); font-weight:bold;">...</span></p>
            <p style="font-size: 0.8rem; color: #666;">Choose a location to save the incoming file directly to your disk.</p>
            <button onclick="answer(true)" class="main-btn" style="background:var(--success)">ACCEPT & SAVE</button>
            <button onclick="answer(false)" class="main-btn" style="background:transparent; color:var(--error); border:1px solid var(--error); margin-top:10px;">REJECT</button>
        </div>
    </div>

    <div class="card">
        <h1>B3AM ENGINE</h1>
        <div style="color:var(--primary); font-size:0.7rem; letter-spacing:3px; font-weight:bold;">v2.1.0 • ULTRA PERFORMANCE</div>
        <div class="id-digit" id="my-id">...</div>
        
        <div id="connect-ui">
            <input type="number" id="remote-id-input" placeholder="ENTER TARGET ID">
            <button id="btn-connect" class="main-btn">ESTABLISH LINK</button>
        </div>

        <div id="transfer-ui" style="display:none;">
            <div id="drop-zone" style="border: 2px dashed #333; padding: 40px; border-radius: 20px; cursor: pointer; color:#555; font-weight:bold;">DRAG & DROP TO B3AM</div>
            <input type="file" id="file-input" hidden multiple>
            <div id="status" style="margin-top:20px; font-size:0.8rem; color:var(--primary);">⚡ LINK ESTABLISHED</div>
            <div id="file-list-ui"></div>
            <button class="main-btn" style="background:transparent; border:1px solid var(--error); color:var(--error); font-size:0.7rem; margin-top:30px;" onclick="location.reload()">TERMINATE CONNECTION</button>
        </div>
    </div>

    <script>
        const myID = Math.floor(100000 + Math.random() * 900000); 
        document.getElementById('my-id').textContent = myID;
        const ui = { input: document.getElementById('remote-id-input'), btnConnect: document.getElementById('btn-connect'), dropZone: document.getElementById('drop-zone'), fileInput: document.getElementById('file-input'), status: document.getElementById('status'), transferArea: document.getElementById('transfer-ui'), connectArea: document.getElementById('connect-ui'), modal: document.getElementById('request-modal'), reqId: document.getElementById('req-id'), fileList: document.getElementById('file-list-ui') };
        
        let peer, conn, reqConn, sending = false;
        let fileQueue = []; 
        let activeTransfers = {}; 

        // --- HIER IST DIE EINZIGE ÄNDERUNG (TURN SERVER HINZUGEFÜGT) ---
        peer = new Peer(`b3am-${myID}`, { 
            debug: 1,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' }, // Standard
                    // Der Schlüssel für Mobile Daten:
                    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
                ]
            }
        });
        // -------------------------------------------------------------

        peer.on('open', () => ui.status.textContent = "✅ Engine Online");
        peer.on('error', (err) => {
            ui.btnConnect.disabled = false;
            ui.status.innerHTML = `<span style="color:var(--error)">⚠️ ENGINE ERROR: ${err.type.toUpperCase()}</span>`;
        });

        peer.on('connection', (c) => {
            c.on('open', () => { reqConn = c; ui.reqId.textContent = c.peer.replace('b3am-',''); ui.modal.style.display='flex'; });
        });

        ui.btnConnect.addEventListener('click', () => {
            const target = ui.input.value;
            if(target.length!==6) return alert("6 Digits required");
            ui.btnConnect.disabled=true;
            ui.status.textContent = "Searching for Peer...";
            conn = peer.connect(`b3am-${target}`, { reliable: true });
            setupConn();
        });

        function answer(yes){
            ui.modal.style.display='none';
            if(yes){ 
                conn = reqConn; 
                conn.send({type:'handshake-ack'}); 
                ui.connectArea.style.display='none'; 
                ui.transferArea.style.display='block'; 
                ui.status.textContent = "⚡ Connected & Ready";
                setupConn(); 
            } 
            else reqConn.close();
        }

        function setupConn(){
            conn.on('data', data => handleData(data));
            conn.on('close', () => location.reload());
            conn.on('open', () => {
                ui.connectArea.style.display='none'; 
                ui.transferArea.style.display='block';
            });
        }

        ui.dropZone.onclick = () => ui.fileInput.click();
        ui.fileInput.onchange = e => {
            for(const file of e.target.files){ 
                fileQueue.push(file); 
                addFileToUI(file.name, 'sending');
            }
            if(!sending) startQueue();
        };

        function addFileToUI(name, type){
            const id = name.replace(/\s+/g, '-');
            const box = document.createElement('div');
            box.className = 'file-box';
            box.innerHTML = `
                <div class="info-text" id="lbl-${id}">${name} - 0%</div>
                <div class="progress-container"><div class="progress-bar" id="bar-${id}"></div></div>
                <button id="btn-${id}" class="main-btn" style="display:none; background:var(--success); font-size:0.7rem;">OPEN FILE</button>
            `;
            ui.fileList.appendChild(box);
            activeTransfers[name] = { 
                bar: document.getElementById(`bar-${id}`), 
                lbl: document.getElementById(`lbl-${id}`),
                btn: document.getElementById(`btn-${id}`)
            };
        }

        async function startQueue(){
            sending = true;
            while(fileQueue.length > 0){
                const file = fileQueue.shift();
                await sendFileUltra(file);
            }
            sending = false;
        }

        async function sendFileUltra(file){
            conn.send({type:'header', name:file.name, size:file.size});
            const reader = file.stream().getReader();
            let sent = 0;
            const id = file.name.replace(/\s+/g, '-');
            const bar = document.getElementById(`bar-${id}`);
            const lbl = document.getElementById(`lbl-${id}`);

            while(true){
                const {done, value} = await reader.read();
                if(done) break;
                
                conn.send({type:'chunk', data:value, name:file.name});
                sent += value.byteLength;
                
                const p = ((sent/file.size)*100).toFixed(1);
                if(bar) bar.style.width = p + '%';
                if(lbl) lbl.textContent = `${file.name} - ${p}%`;

                if(conn.dataChannel.bufferedAmount > 1024*1024*16) await new Promise(r=>setTimeout(r,15));
            }
            conn.send({type:'end', name:file.name});
        }

        async function handleData(data){
            if(data.type==='handshake-ack'){ 
                ui.connectArea.style.display='none'; 
                ui.transferArea.style.display='block'; 
            }
            else if(data.type==='header'){
                addFileToUI(data.name, 'receiving');
                const t = activeTransfers[data.name];
                t.total = data.size;
                t.bytes = 0;
                
                // FileSystem Access
                try {
                    if(window.showSaveFilePicker) {
                        const handle = await window.showSaveFilePicker({ suggestedName: data.name });
                        t.writable = await handle.createWritable();
                    } else {
                        t.chunks = []; // Fallback für Handys
                    }
                } catch(e) { console.log("Stream error, falling back to blob"); t.chunks = []; }
            }
            else if(data.type==='chunk'){
                const t = activeTransfers[data.name];
                if(t){
                    if(t.writable) {
                        await t.writable.write(data.data);
                    } else {
                        t.chunks.push(data.data);
                    }
                    t.bytes += data.data.byteLength;
                    const p = ((t.bytes/t.total)*100).toFixed(1);
                    if(t.bar) t.bar.style.width = p + '%';
                    if(t.lbl) t.lbl.textContent = `${data.name} - ${p}%`;
                }
            }
            else if(data.type==='end'){
                const t = activeTransfers[data.name];
                if(t){
                    if(t.writable) {
                        await t.writable.close();
                        t.btn.style.display = 'block';
                        t.btn.textContent = "SAVED TO DISK";
                    } else {
                        const blob = new Blob(t.chunks);
                        const url = URL.createObjectURL(blob);
                        t.btn.style.display = 'block';
                        t.btn.onclick = () => {
                            const a = document.createElement('a');
                            a.href = url; a.download = data.name; a.click();
                        };
                    }
                    ui.status.textContent = `✅ ${data.name} COMPLETE`;
                    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                }
            }
        }
    </script>
</body>
</html>
